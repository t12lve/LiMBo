# ts-rs configuration for the desktop crate.
#
# The Rust types are the single source of truth for the WebSocket wire contract; `#[ts(export)]`
# writes the generated TypeScript bindings straight into the shared workspace package
# (`@limbo/shared`), which re-exports them. Run `cargo test export_bindings` to regenerate.
[env]
TS_RS_EXPORT_DIR = { value = "../../../packages/shared/src/generated", relative = true }
# Render `i64`/`u64` as `number` (not `bigint`) so the bindings match the JS runtime values.
TS_RS_LARGE_INT = "number"
